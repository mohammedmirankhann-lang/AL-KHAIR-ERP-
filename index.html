[hidden]{display:none !important}
/* Layout: letterhead-style header (navy bar, gold name, gold stripe), tab row under it, one content column. Colours and fonts come from the Al-Khair brand book. */
:root{
  --bg:#f3f4f8; --surface:#ffffff; --surface2:#eceef4; --ink:#1b2433; --muted:#566074; --line:#d8dce6;
  --navy:#1f3a5f; --navy-ink:#ffffff; --gold:#c4a55a; --gold-soft:#f5eed9; --gold-ink:#6b5513;
  --btn:#1f3a5f; --btn-ink:#ffffff; --link:#1f3a5f;
  --good:#1b7a3c; --good-soft:#dcf0e2; --warn:#8f5f00; --warn-soft:#f7ebcb; --bad:#b3261e; --bad-soft:#f8dedb;
  --c-hist:#1f3a5f; --c-fc:#b08a2e; --c-2:#b3261e;
  --f-head:'Cinzel',Georgia,serif; --f-body:'Lato',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1522; --surface:#162030; --surface2:#1d2a3d; --ink:#e8edf6; --muted:#9ba8be; --line:#2b3a50;
    --navy:#13243d; --navy-ink:#ffffff; --gold:#d6b866; --gold-soft:#2f2a18; --gold-ink:#e8d594;
    --btn:#d6b866; --btn-ink:#14213a; --link:#9fc0f0;
    --good:#62d08b; --good-soft:#1b3a28; --warn:#e5ab3c; --warn-soft:#3b2e12; --bad:#ff8c82; --bad-soft:#3d201e;
    --c-hist:#8fb4ee; --c-fc:#d6b866; --c-2:#ff8c82;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1522; --surface:#162030; --surface2:#1d2a3d; --ink:#e8edf6; --muted:#9ba8be; --line:#2b3a50;
  --navy:#13243d; --navy-ink:#ffffff; --gold:#d6b866; --gold-soft:#2f2a18; --gold-ink:#e8d594;
  --btn:#d6b866; --btn-ink:#14213a; --link:#9fc0f0;
  --good:#62d08b; --good-soft:#1b3a28; --warn:#e5ab3c; --warn-soft:#3b2e12; --bad:#ff8c82; --bad-soft:#3d201e;
  --c-hist:#8fb4ee; --c-fc:#d6b866; --c-2:#ff8c82;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-text-size-adjust:100%}
h1,h2,h3{margin:0;font-weight:700;text-wrap:balance}
h1{font-family:var(--f-head);font-size:24px;letter-spacing:.02em}
h2{font-size:17px}
h3{font-size:15px}
p{margin:0}
a{color:var(--link)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:12.5px} .r{text-align:right} .nowrap{white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* header */
.hdr{background:var(--navy);color:var(--navy-ink);border-bottom:4px solid var(--gold)}
.hdr-in{max-width:1240px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px}
.brand .bt{display:grid;gap:2px}
.brand .logo{height:50px;width:auto;display:block}
.brand b{font-family:var(--f-head);color:var(--gold);font-size:21px;letter-spacing:.07em;font-weight:700}
.brand i{font-size:12.5px;opacity:.85}
.hdr-right{display:flex;align-items:center;gap:12px;font-size:13px}
.hdr-right .who{opacity:.85}
.tabs{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.tabs-in{max-width:1240px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto}
.tabs a{padding:12px 14px;text-decoration:none;color:var(--muted);font-weight:700;font-size:14px;white-space:nowrap;border-bottom:3px solid transparent}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--gold)}
main{max-width:1240px;margin:0 auto;padding:20px 16px 56px;display:grid;gap:16px;align-content:start}
.pagehead{display:flex;gap:10px 16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.pagehead .sub{color:var(--muted);font-size:13.5px;margin-top:2px}

/* controls */
.btn{cursor:pointer;border:1px solid var(--btn);background:var(--btn);color:var(--btn-ink);padding:8px 14px;border-radius:6px;font-weight:700;font-size:14px;white-space:nowrap}
.btn:hover{filter:brightness(1.1)} .btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--link);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--link)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.input,select.input,textarea.input{width:100%;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
textarea.input{min-height:72px;resize:vertical}
.field{display:grid;gap:4px;min-width:0}
.field>label{font-size:12.5px;font-weight:700;color:var(--muted)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar .input{width:auto;flex:1 1 180px;max-width:320px}
.toolbar select.input{flex:0 0 auto;max-width:none}
.grow{margin-left:auto}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.card-head{display:flex;gap:8px 16px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:8px;padding:12px 16px;display:grid;gap:3px;min-width:0}
.kpi .v{font-size:27px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px}
.grid2e{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface2)}
td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface2)}
tr.total td{font-weight:700;background:var(--surface2)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.neutral{background:var(--surface2);color:var(--muted)}
.pill.gold{background:var(--gold-soft);color:var(--gold-ink)}
.list{margin:0;padding:0;list-style:none}
.list li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list li>div{min-width:0}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:84px minmax(0,1fr) 78px;gap:10px;align-items:center;font-size:13px}
.bar .track{height:12px;background:var(--surface2);border-radius:3px;overflow:hidden}
.bar .fill{height:100%;background:var(--navy);border-radius:3px}
:root[data-theme="dark"] .bar .fill{background:var(--c-hist)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bar .fill{background:var(--c-hist)}}
.bar .fill.gold{background:var(--gold)}
.bar .val{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:18px;border-top:2px solid var(--c-hist);vertical-align:middle;margin-right:6px}
.legend i.fc{border-top:2px dashed var(--c-fc)} .legend i.two{border-top-color:var(--c-2)}
.legend i.band{height:10px;border:0;background:var(--c-fc);opacity:.28;border-radius:2px}
svg.chart{width:100%;height:auto;display:block}
.ch-grid{stroke:var(--line);stroke-width:1} .ch-axis{fill:var(--muted);font:11px var(--f-body)}
.ch-line{fill:none;stroke:var(--c-hist);stroke-width:2.2;stroke-linejoin:round}
.ch-line2{fill:none;stroke:var(--c-2);stroke-width:2.2;stroke-linejoin:round}
.ch-area{fill:var(--c-hist);opacity:.1}
.ch-fc{fill:none;stroke:var(--c-fc);stroke-width:2.2;stroke-dasharray:6 4}
.ch-band{fill:var(--c-fc);opacity:.2} .ch-split{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 4}
.ch-dot{fill:var(--surface);stroke:var(--c-hist);stroke-width:2.5} .ch-dot.fc{stroke:var(--c-fc);stroke-width:2}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:5px 12px;font-size:13px;font-weight:700;background:var(--surface);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
.seg button:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.banner{background:var(--warn-soft);border:1px solid var(--gold);border-radius:8px;padding:10px 14px;font-size:13.5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--surface2);border-radius:6px;padding:8px 12px}
.stat b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.err{color:var(--bad);font-size:13px;min-height:19px}
code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--surface2);padding:1px 5px;border-radius:4px}

/* login */
.gate{min-height:100vh;display:grid;grid-template-rows:auto 1fr}
.gate-body{display:grid;place-items:center;padding:24px 16px}
.gate-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:26px;display:grid;gap:14px}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(8,14,26,.6);display:grid;place-items:start center;padding:24px 16px;z-index:60;overflow-y:auto}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:min(560px,100%);padding:20px;display:grid;gap:14px;margin:auto 0}
.sheet.wide{width:min(760px,100%)}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;z-index:80;max-width:min(520px,92vw);font-size:14px;border-left:4px solid var(--gold)}
.toast.bad{border-left-color:var(--bad)}

/* receipt */
.receipt-sheet{background:#fff;color:#111;border:1px solid #bbb;position:relative;font-size:14px}
.rc-head{background:#1f3a5f;color:#c4a55a;padding:12px 18px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.rc-head b{font-family:var(--f-head);font-size:22px;letter-spacing:.07em;display:block}
.rc-head i{color:#fff;font-size:12px;opacity:.9}
.rc-head .dise{color:#fff;font-size:11.5px;text-align:right}
.rc-stripe{height:4px;background:#c4a55a}
.rc-title{text-align:center;font-family:var(--f-head);font-weight:700;letter-spacing:.12em;padding:12px 0 4px;color:#1f3a5f;font-size:17px}
.rc-body{padding:6px 18px 14px}
.rc-body table{font-size:14px} .rc-body td{border-bottom:1px solid #ddd;padding:6px 4px;color:#111} .rc-body td:first-child{color:#555;width:38%}
.rc-foot{background:#1f3a5f;color:#fff;font-size:11.5px;text-align:center;padding:8px 12px}
.rc-sign{display:flex;justify-content:space-between;padding:26px 18px 10px;font-size:12.5px;color:#444}
.rc-cancel{position:absolute;inset:0;display:grid;place-items:center;font-size:54px;color:rgba(179,38,30,.28);transform:rotate(-18deg);font-weight:700;letter-spacing:.1em;pointer-events:none}
@media (max-width:820px){
  .grid2{grid-template-columns:minmax(0,1fr)}
  h1{font-size:21px}
  .brand b{font-size:18px}
}
@media print{
  body *{visibility:hidden}
  .receipt-sheet,.receipt-sheet *{visibility:visible}
  .receipt-sheet{position:absolute;left:0;top:0;width:100%;border:0}
  .receipt-sheet .rc-head,.receipt-sheet .rc-foot,.receipt-sheet .rc-stripe{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important}}
</style>

/* ---------- small helpers ---------- */
const $=(s,e)=>(e||document).querySelector(s), $$=(s,e)=>Array.from((e||document).querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=Number(v);return isFinite(n)?n:0};
const sum=a=>a.reduce((x,y)=>x+y,0), avg=a=>a.length?sum(a)/a.length:0;
const inr=n=>(num(n)<0?'-':'')+'₹'+Math.abs(num(n)).toLocaleString('en-IN',{maximumFractionDigits:2,minimumFractionDigits:0});
const inrShort=n=>{const a=Math.abs(n);if(a>=1e7)return '₹'+(n/1e7).toFixed(1)+'Cr';if(a>=1e5)return '₹'+(n/1e5).toFixed(1)+'L';if(a>=1e3)return '₹'+(n/1e3).toFixed(0)+'k';return '₹'+Math.round(n)};
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const ym=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const addMonth=(m,k)=>{const a=m.split('-').map(Number);return ym(new Date(a[0],a[1]-1+k,1))};
const monthLabel=m=>MONTHS[+m.slice(5,7)-1]+' '+m.slice(2,4);
const monthIdx=m=>+m.slice(5,7)-1;
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtDate=s=>{if(!s)return '';const d=new Date(String(s).length<=10?s+'T00:00:00':s);return isNaN(d)?String(s):d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})};
function words(n){
  n=Math.round(num(n)*100)/100;const rupees=Math.floor(n),paise=Math.round((n-rupees)*100);
  if(rupees===0&&paise===0)return 'Zero';
  const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const two=x=>x<20?a[x]:b[Math.floor(x/10)]+(x%10?' '+a[x%10]:'');
  const three=x=>x>99?a[Math.floor(x/100)]+' Hundred'+(x%100?' '+two(x%100):''):two(x);
  let r=rupees,s='';const cr=Math.floor(r/1e7);r%=1e7;const la=Math.floor(r/1e5);r%=1e5;const th=Math.floor(r/1e3);r%=1e3;
  if(cr)s+=three(cr)+' Crore ';if(la)s+=two(la)+' Lakh ';if(th)s+=two(th)+' Thousand ';if(r)s+=three(r);
  s=s.trim()||'Zero';
  return s+(paise?' and '+two(paise)+' Paise':'');
}

function csvDownload(name,rows){

  const text=rows.map(r=>r.map(f).join(',')).join('\r\n');

function niceTicks(min,max,count){
  const span=(max-min)||Math.abs(max)||1,step0=span/(count||5),mag=Math.pow(10,Math.floor(Math.log10(step0))),norm=step0/mag;
  const step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag,lo=Math.floor(min/step)*step,hi=Math.ceil(max/step)*step,t=[];
  for(let v=lo;v<=hi+step/2;v+=step)t.push(+v.toFixed(10));return t;
}

/* ---------- forecast: straight-line trend x month-of-year seasonality, with an 80% range ---------- */
function makeForecast(series,h,opt){
  opt=opt||{};const n=series.length;
  if(n<6)return{fc:[],note:'At least 6 months of history are needed to forecast.',seasonal:false,slope:0};
  const seasonal=!!opt.seasonal&&n>=24,mo=series.map(p=>monthIdx(p.m));let S=Array(12).fill(1);
  const fit=ys=>{const xb=(n-1)/2,yb=avg(ys);let sxx=0,sxy=0;ys.forEach((y,i)=>{sxx+=(i-xb)*(i-xb);sxy+=(i-xb)*(y-yb)});const b=sxy/sxx;return{a:yb-b*xb,b,xb,sxx}};
  let f=fit(series.map(p=>p.y));
  if(seasonal){for(let it=0;it<2;it++){
    const sm=Array(12).fill(0),ct=Array(12).fill(0);
    series.forEach((p,i)=>{const t=f.a+f.b*i;if(t>0){sm[mo[i]]+=p.y/t;ct[mo[i]]++}});
    const raw=sm.map((v,k)=>ct[k]?v/ct[k]:1),mean=avg(raw.filter((v,k)=>ct[k]));S=raw.map((v,k)=>ct[k]?v/mean:1);
    f=fit(series.map((p,i)=>p.y/S[mo[i]]));}}
  const res=series.map((p,i)=>p.y-(f.a+f.b*i)*S[mo[i]]),sd=Math.sqrt(sum(res.map(x=>x*x))/Math.max(1,n-2)),out=[];
  let m=series[n-1].m;
  while(out.length<h){m=addMonth(m,1);const i=n+out.length,yhat=(f.a+f.b*i)*S[monthIdx(m)],w=1.28*sd*Math.sqrt(1+1/n+((i-f.xb)*(i-f.xb))/f.sxx);
    out.push({m,y:Math.max(0,yhat),lo:Math.max(0,yhat-w),hi:Math.max(0,yhat+w)});}
  return{fc:out,seasonal,slope:f.b,sd,note:seasonal?'Straight-line trend adjusted for month-by-month seasonality.':(opt.seasonal?'Less than 24 months of history, so only a straight-line trend is used.':'Straight-line trend.')};
}
function monthlySeries(rows){ // missing months count as zero collection; the running month is left out
  const map={};rows.forEach(r=>{const m=String(r.month).slice(0,7);map[m]=(map[m]||0)+num(r.amount)});
  const cur=ym(new Date()),ks=Object.keys(map).filter(k=>k<cur).sort();if(!ks.length)return[];
  const out=[];for(let m=ks[0];m<=ks[ks.length-1];m=addMonth(m,1))out.push({m,y:map[m]||0});return out;
}

/* ---------- charts ---------- */
const r1=v=>Math.round(v*10)/10;
function lineChart(hist,fc,label,second){
  if(!hist.length)return'<div class="empty">No history yet.</div>';
  const W=760,H=290,L=60,R=14,T=22,B=30,n=hist.length+fc.length;
  const vals=hist.map(p=>p.y).concat(fc.reduce((a,p)=>a.concat([p.lo,p.hi]),[])).concat(second?second.map(p=>p.y):[]);
  const tk=niceTicks(Math.min(0,Math.min.apply(null,vals)),Math.max.apply(null,vals),5),y0=tk[0],y1=tk[tk.length-1];
  const X=i=>r1(L+(W-L-R)*(n===1?0:i/(n-1))),Y=v=>r1(T+(H-T-B)*(1-(v-y0)/((y1-y0)||1)));
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(label)+'">';
  tk.forEach(v=>{s+='<line class="ch-grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text class="ch-axis" x="'+(L-8)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+esc(inrShort(v))+'</text>'});
  const all2=hist.concat(fc),step=Math.ceil(n/9);
  all2.forEach((p,i)=>{if(i%step===0)s+='<text class="ch-axis" x="'+X(i)+'" y="'+(H-9)+'" text-anchor="middle">'+monthLabel(p.m)+'</text>'});
  const hl=hist.length-1,line=hist.map((p,i)=>X(i)+','+Y(p.y)).join('L');
  s+='<path class="ch-area" d="M'+line+'L'+X(hl)+','+Y(y0)+'L'+X(0)+','+Y(y0)+'Z"/><path class="ch-line" d="M'+line+'"/>';
  if(second)s+='<path class="ch-line2" d="M'+second.map((p,i)=>X(i)+','+Y(p.y)).join('L')+'"/>';
  if(fc.length){
    const up=fc.map((p,j)=>X(hl+1+j)+','+Y(p.hi)).join('L'),dn=fc.map((p,j)=>X(hl+1+j)+','+Y(p.lo)).reverse().join('L');
    s+='<line class="ch-split" x1="'+X(hl)+'" x2="'+X(hl)+'" y1="'+T+'" y2="'+(H-B)+'"/><text class="ch-axis" x="'+(X(hl)+6)+'" y="'+(T-7)+'">Forecast</text>';
    s+='<path class="ch-band" d="M'+X(hl)+','+Y(hist[hl].y)+'L'+up+'L'+dn+'Z"/>';
    s+='<path class="ch-fc" d="M'+X(hl)+','+Y(hist[hl].y)+'L'+fc.map((p,j)=>X(hl+1+j)+','+Y(p.y)).join('L')+'"/>';
    fc.forEach((p,j)=>{s+='<circle class="ch-dot fc" cx="'+X(hl+1+j)+'" cy="'+Y(p.y)+'" r="3.5"><title>'+monthLabel(p.m)+' forecast '+esc(inr(p.y))+' (range '+esc(inr(p.lo))+' to '+esc(inr(p.hi))+')</title></circle>'});
  }
  hist.forEach((p,i)=>{s+='<circle class="ch-dot" cx="'+X(i)+'" cy="'+Y(p.y)+'" r="'+(i===hl?5:2.2)+'" '+(i===hl?'':'style="fill:var(--c-hist)"')+'><title>'+monthLabel(p.m)+': '+esc(inr(p.y))+'</title></circle>'});
  return s+'</svg>';
}
function bars(items,fmt,gold){
  const mx=Math.max.apply(null,items.map(i=>i.v).concat([1]));
  return'<div class="bars">'+items.map(i=>'<div class="bar"><span>'+esc(i.l)+'</span><div class="track"><div class="fill'+(gold?' gold':'')+'" style="width:'+Math.max(1.5,i.v/mx*100)+'%"></div></div><span class="val">'+esc(fmt?fmt(i.v):i.v)+'</span></div>').join('')+'</div>';
}

function studentPayload(fd){

const IDS=[['has_pen','PEN'],['has_apaar','APAAR'],['has_aadhaar','Aadhaar'],['has_samagra','Samagra']];
const idMiss=(r,k)=>r['req_'+k.slice(4)]!==false&&!r[k];

  const total=rows.length,need=k=>rows.filter(r=>r['req_'+k.slice(4)]!==false).length,have=k=>rows.filter(r=>r['req_'+k.slice(4)]!==false&&r[k]).length;

   '<div class="card"><h2 style="margin-bottom:10px">Class-wise: who is still missing</h2><div class="tablewrap"><table><thead><tr><th>Class</th><th class="r">Students</th>'+IDS.map(i=>'<th class="r">'+i[1]+'</th>').join('')+'</tr></thead><tbody>'+

   '<p class="muted small" style="margin-top:8px">Aadhaar shows as submitted when the last 4 digits are on file. The full number is never stored.</p></div>'+
   '<div class="card" style="margin-top:14px"><div class="toolbar" style="margin-bottom:10px"><input class="input" id="dq" placeholder="Search name or admission no" aria-label="Search" value="'+esc(docState.q)+'">'+
   '<select class="input" id="dc" aria-label="Class"><option value="all">All classes</option>'+S.classes.map(c=>'<option value="'+esc(c.name)+'"'+(docState.cls===c.name?' selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select>'+
   '<select class="input" id="dm" aria-label="Show">'+[['any','Anything missing'],['has_pen','PEN missing'],['has_apaar','APAAR missing'],['has_aadhaar','Aadhaar missing'],['has_samagra','Samagra missing'],['all','Everyone']].map(o=>'<option value="'+o[0]+'"'+(docState.miss===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+'</select><span class="muted small" id="dn"></span></div><div id="dt"></div></div>';
  let cur=[];

     show.map(r=>'<tr class="click" data-e="'+esc(r.enrollment_id)+'"><td class="nowrap">'+esc(r.admission_no)+'</td><td><a href="#/student/'+esc(r.enrollment_id)+'">'+esc(r.full_name)+'</a></td><td class="nowrap">'+esc(r.class_name)+'</td><td class="nowrap">'+esc(r.guardian_mobile||'')+'</td>'+IDS.map(i=>'<td>'+mark(r,i[0])+'</td>').join('')+'<td>'+(other[r.student_id]?'<span class="pill warn">'+other[r.student_id]+' missing</span>':'<span class="pill good">Complete</span>')+'</td></tr>').join('')+'</tbody></table></div>'+
     (cur.length>show.length?'<p class="muted small" style="margin-top:8px">Showing the first 150 of '+cur.length+'. Pick a class to narrow the list. Download list has everyone.</p>':'');

  $('#dm').addEventListener('change',e=>{docState.miss=e.target.value;paint()});

    if(typeof XLSX==='undefined'){toast('The spreadsheet writer could not load. Reload and try again.',true);return}

    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(data),'Documents');
    XLSX.writeFile(wb,'AlKhair_documents_'+S.year.label+'.xlsx');
  };
}

   (fc.length?'<div class="grid2e"><div class="card"><h2 style="margin-bottom:6px">What to expect</h2><ul class="list">'+insight.map(t=>'<li><div>'+esc(t)+'</div></li>').join('')+'</ul></div><div class="tablewrap"><table><thead><tr><th>Month</th><th class="r">Forecast</th><th class="r">Low</th><th class="r">High</th></tr></thead><tbody>'+fc.map(p=>'<tr><td>'+monthLabel(p.m)+'</td><td class="r"><b>'+inr(p.y)+'</b></td><td class="r">'+inr(p.lo)+'</td><td class="r">'+inr(p.hi)+'</td></tr>').join('')+'</tbody></table></div></div>':'<div class="card empty">'+esc(F.note||'')+'</div>')+
   '<div class="grid2e"><div class="card"><h2 style="margin-bottom:12px">Collection by financial year</h2>'+(fyRows.length?bars(fyRows,inrShort,true):'<p class="muted">No history.</p>')+'</div>'+

function pickCol(keys,al){return keys.find(k=>al.includes(hk(k)))}
function normClass(v){
  let s=String(v==null?'':v).trim().toLowerCase().replace(/^class\s*/,'').replace(/(st|nd|rd|th)$/,'').replace(/[^a-z0-9]/g,'');
  const rm={i:'1',ii:'2',iii:'3',iv:'4',v:'5',vi:'6',vii:'7',viii:'8'};
  if(['nursery','nur','pg','playgroup'].includes(s))return'Nursery';if(['lkg','kg1','jrkg'].includes(s))return'LKG';if(['ukg','kg2','srkg'].includes(s))return'UKG';
  if(rm[s])return'Class '+rm[s];if(/^[1-8]$/.test(s))return'Class '+s;return null;
}
function parseMonth(v){
  if(v instanceof Date&&!isNaN(v))return ym(v);const s=String(v==null?'':v).trim();let a;
  if((a=s.match(/^(\d{4})[-\/](\d{1,2})/)))return a[1]+'-'+a[2].padStart(2,'0');
  if((a=s.match(/^([A-Za-z]{3})[A-Za-z]*[\s\-\/']*(\d{2,4})$/))){const k=MONTHS.findIndex(x=>x.toLowerCase()===a[1].toLowerCase());if(k>-1)return(a[2].length===2?'20'+a[2]:a[2])+'-'+String(k+1).padStart(2,'0')}
  return null;
}
const dateStr=v=>{if(v instanceof Date&&!isNaN(v))return v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0')+'-'+String(v.getDate()).padStart(2,'0');const s=String(v==null?'':v).trim();return /^\d{4}-\d{2}-\d{2}$/.test(s)?s:null};

async function readFile(file,el){
  const k=imp.kind,fail=m=>{imp.result={error:m};vImport(el)};
  if(typeof XLSX==='undefined')return fail('The spreadsheet reader could not load. Check your connection and reload.');
  try{
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:true});
    if(!rows.length)return fail('The first sheet has no data rows.');
    const keys=Object.keys(rows[0]),C=n=>pickCol(keys,ALIAS[n]),ok=[],skipped=[];
    if(k==='students'){
      const c={adm:C('adm'),name:C('name'),cls:C('cls')};if(!c.adm||!c.name||!c.cls)return fail('Could not find Admission No, Name and Class columns in the first row.');
      const exist=new Set((await all((a,b)=>sb.from('students').select('admission_no').range(a,b))).map(s=>s.admission_no)),seen=new Set();
      rows.forEach((r,i)=>{const adm=String(r[c.adm]).trim(),nm=String(r[c.name]).trim(),cn=normClass(r[c.cls]);
        if(!adm||!nm)return skipped.push({row:i+2,why:'missing admission no or name'});if(!cn)return skipped.push({row:i+2,why:'class "'+r[c.cls]+'" not understood'});
        if(exist.has(adm)||seen.has(adm))return skipped.push({row:i+2,why:'admission no '+adm+' already exists'});seen.add(adm);
        const g=String(C('gender')?r[C('gender')]:'').trim().toLowerCase(),gender=['male','female','other'].includes(g)?g:(g[0]==='m'?'male':g[0]==='f'?'female':null);
        const gv=n=>C(n)?String(r[C(n)]==null?'':r[C(n)]).trim()||null:null;
        ok.push({cls:cn,row:{admission_no:adm,full_name:nm,father_name:gv('father'),mother_name:gv('mother'),guardian_mobile:gv('mobile'),dob:C('dob')?dateStr(r[C('dob')]):null,gender,address:gv('address'),pen:gv('pen'),samagra_id:gv('samagra'),family_id:gv('family'),admission_date:C('adate')?dateStr(r[C('adate')]):null},show:{'Admission No':adm,Name:nm,Class:cn,Father:gv('father')||'',Mobile:gv('mobile')||''}});});
      imp.result={ok,skipped,head:['Admission No','Name','Class','Father','Mobile']};
    }else{
      const c={m:C('month'),a:C('amount')};if(!c.m||!c.a)return fail('Could not find Month and Amount columns in the first row.');
      rows.forEach((r,i)=>{const m=parseMonth(r[c.m]),a=r[c.a]===''?null:Number(String(r[c.a]).replace(/[₹,\s]/g,''));
        if(!m||a==null||!isFinite(a))return skipped.push({row:i+2,why:'month or amount not understood'});ok.push({row:{month:m+'-01',amount:a,source:'import'},show:{Month:monthLabel(m),Amount:inr(a)}});});
      imp.result={ok,skipped,head:['Month','Amount']};
    }
    vImport(el);
  }catch(e){fail('That file could not be read. Save it as .xlsx or .csv and try again.')}
}

  return o;

async function staffImport(file){
  if(typeof XLSX==='undefined')throw new Error('The spreadsheet reader could not load. Reload and try again.');
  const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:true});
  if(!rows.length)throw new Error('The file has no rows');
  const norm=k=>String(k).toLowerCase().replace(/[^a-z]/g,'');
  const pick=(r,...names)=>{for(const k of Object.keys(r)){if(names.includes(norm(k))&&r[k]!=='')return r[k]}return ''};
  const ds=v=>{if(!v)return null;if(v instanceof Date)return new Date(v.getTime()-v.getTimezoneOffset()*60000).toISOString().slice(0,10);const t=String(v).trim();return /^\d{4}-\d{2}-\d{2}/.test(t)?t.slice(0,10):null};
  const out=[];
  rows.forEach(r=>{const nm=String(pick(r,'name','fullname','staffname','teachername')).trim();if(!nm)return;
    const ph=String(pick(r,'mobile','phone','contact','contactno','mobileno')).replace(/\D/g,'').slice(-10);
    const g=String(pick(r,'gender','sex')).toLowerCase();
    const sal=Number(String(pick(r,'salary','monthlysalary')).replace(/[^\d.]/g,''));
    out.push({full_name:nm,designation:String(pick(r,'designation','post','role')).trim()||null,subjects:String(pick(r,'subjects','subject')).trim()||null,classes_taught:String(pick(r,'classes','class','classestaught')).trim()||null,phone:ph.length===10?ph:null,email:String(pick(r,'email','emailid')).trim().toLowerCase()||null,dob:ds(pick(r,'dob','dateofbirth','birthdate')),gender:/^f/.test(g)?'female':/^m/.test(g)?'male':null,joined_on:ds(pick(r,'joiningdate','joined','dateofjoining','doj')),qualification:String(pick(r,'qualification')).trim()||null,address:String(pick(r,'address')).trim()||null,monthly_salary:sal>0?Math.round(sal):null})});
  if(!out.length)throw new Error('No names found. The first row must have headings like Name, Designation, Mobile.');
  await q(sb.from('staff').insert(out));
}

   '<div class="row2">'+inp('geo_lat','Latitude',c.geo_lat==null?'':c.geo_lat,'number','step="0.000001"')+inp('geo_lng','Longitude',c.geo_lng==null?'':c.geo_lng,'number','step="0.000001"')+'</div>'+
   '<button type="button" class="btn ghost" id="geo">Use my current location</button><p class="muted small">Open this page on your phone while standing inside the school (ideally in the middle of the building) and tap the button. The location shown here is used to measure every teacher\'s distance.</p>'+
   inp('geo_radius_m','Allowed distance from school (metres)',c.geo_radius_m,'number','min="20" max="2000" step="10"','150 m covers most buildings. Lower it if you want it stricter.')+
   '<h3 style="margin-top:6px">Timing and rules</h3>'+
   '<div class="row2">'+inp('shift_start','School starts',t(c.shift_start),'time')+inp('shift_end','School ends',t(c.shift_end),'time')+'</div>'+
   '<div class="row2">'+inp('grace_minutes','On time up to (minutes after start)',c.grace_minutes,'number','min="0"')+inp('halfday_after_minutes','Half day if later than (minutes after start)',c.halfday_after_minutes,'number','min="0"')+'</div>'+
   inp('paid_leaves_per_month','Paid leaves per month',c.paid_leaves_per_month==null?'':c.paid_leaves_per_month,'number','min="0" step="0.5"','Used for salary. Leave empty until you decide.')+
   '<div class="field"><label>Weekly off</label><div style="display:flex;gap:10px;flex-wrap:wrap">'+DAYN.map((d,i)=>'<label style="display:flex;gap:4px;align-items:center;font-weight:400"><input type="checkbox" name="wo" value="'+i+'"'+((c.weekly_off||[]).includes(i)?' checked':'')+'>'+d+'</label>').join('')+'</div></div>'+
   '<div class="err" id="gerr" role="alert"></div><button class="btn" type="submit">Save settings</button></form></div>'+
   '<div class="card"><h2 style="margin-bottom:10px">Holidays</h2><form id="hf" class="toolbar" style="margin-bottom:10px"><input class="input" type="date" id="hd" required aria-label="Date"><input class="input" id="hn" placeholder="Name, e.g. Eid" required aria-label="Holiday name"><button class="btn" type="submit">Add</button></form>'+
   (B.hol.length?'<ul class="list">'+B.hol.map(h=>'<li><div><b>'+fmtDate(h.holiday_on)+'</b> · '+esc(h.name)+'</div><button class="btn danger sm" style="margin-left:auto" data-hd="'+esc(h.holiday_on)+'">Remove</button></li>').join('')+'</ul>':'<p class="muted small">No holidays added. Sundays (weekly off) are already skipped.</p>')+'</div></div>';
  $('#geo').onclick=()=>{
    if(!navigator.geolocation){toast('This phone or browser cannot give location',true);return}
    $('#geo').textContent='Getting location…';
    navigator.geolocation.getCurrentPosition(p=>{$('#geo_lat').value=p.coords.latitude.toFixed(6);$('#geo_lng').value=p.coords.longitude.toFixed(6);$('#geo').textContent='Use my current location';toast('Location filled (accuracy about '+Math.round(p.coords.accuracy)+' m). Now press Save settings.')},
      er=>{$('#geo').textContent='Use my current location';toast(er.code===1?'Allow location access for this site, then try again':'Could not get location. Try near a window',true)},{enableHighAccuracy:true,timeout:25000,maximumAge:0});
  };
  $('#gf').onsubmit=async e=>{e.preventDefault();$('#gerr').textContent='';
    try{const g=n=>($('#'+n).value||'').trim(),num0=n=>g(n)===''?null:Number(g(n));
      const row={geo_lat:num0('geo_lat'),geo_lng:num0('geo_lng'),geo_radius_m:Number(g('geo_radius_m')||150),shift_start:g('shift_start')||'08:00',shift_end:g('shift_end')||'14:00',grace_minutes:Number(g('grace_minutes')||0),halfday_after_minutes:Number(g('halfday_after_minutes')||0),paid_leaves_per_month:num0('paid_leaves_per_month'),weekly_off:[...document.querySelectorAll('input[name=wo]:checked')].map(x=>Number(x.value))};
      if((row.geo_lat==null)!==(row.geo_lng==null))throw new Error('Fill both latitude and longitude');
      await q(sb.from('school_settings').update(row).eq('id',true));toast('Settings saved');vStaff($('#view'))}catch(er){$('#gerr').textContent=errMsg(er)}};
  $('#hf').onsubmit=async e=>{e.preventDefault();try{await q(sb.from('school_holidays').upsert({holiday_on:$('#hd').value,name:$('#hn').value.trim()}));vStaff($('#view'))}catch(er){toast(errMsg(er),true)}};
  $$('[data-hd]').forEach(b=>b.onclick=async()=>{try{await q(sb.from('school_holidays').delete().eq('holiday_on',b.dataset.hd));vStaff($('#view'))}catch(er){toast(errMsg(er),true)}});
}

/* =================================================================
   TEACHER SELF SERVICE: punch in / out
================================================================= */
async function vSetPassword(el){
  el.innerHTML='<div class="card" style="max-width:420px;margin:24px auto"><h2>Set your own password</h2><p class="muted small" style="margin:6px 0 12px">You signed in with a temporary password. Choose a new one that only you know.</p><form id="pf" style="display:grid;gap:12px">'+inp('np1','New password','','password','minlength="8" required autocomplete="new-password"','At least 8 characters')+inp('np2','Type it again','','password','minlength="8" required autocomplete="new-password"')+'<div class="err" id="perr" role="alert"></div><button class="btn" type="submit">Save password</button></form></div>';
  $('#pf').onsubmit=async e=>{e.preventDefault();$('#perr').textContent='';
    if($('#np1').value!==$('#np2').value){$('#perr').textContent='The two passwords are not the same';return}
    const {error}=await sb.auth.updateUser({password:$('#np1').value,data:{temp_password:false}});
    if(error){$('#perr').textContent=error.message;return}
    S.user.user_metadata=Object.assign({},S.user.user_metadata,{temp_password:false});toast('Password saved');route()};
}
async function vMyAttendance(el){
  const me=await q(sb.from('staff').select('*').eq('user_id',S.user.id).maybeSingle());
  if(!me){el.innerHTML='<div class="card empty">Your login is not linked to a staff record. Ask the owner.</div>';return}
  const cfg=await q(sb.from('school_settings').select('geo_lat,geo_radius_m,shift_start,shift_end,grace_minutes').limit(1).single()).catch(()=>null);
  const first=today().slice(0,7)+'-01';
  const rows=await q(sb.from('staff_attendance').select('*').gte('work_date',first).order('work_date',{ascending:false}));
  const td=rows.find(r=>r.work_date===today());
  const cnt=k=>rows.filter(r=>k.includes(r.status)).length;
  el.innerHTML=head('Hello, '+me.full_name.split(' ')[0],fmtDate(today())+(me.designation?' · '+me.designation:''),'')+
   '<div class="card" style="text-align:center;max-width:520px;margin:0 auto 14px"><p class="muted small">Today</p><div style="font-size:22px;margin:6px 0">'+(td?stPill(td.status):'<span class="pill neutral">Not punched in</span>')+'</div>'+
   '<p class="small">'+(td&&td.check_in?'In '+hhmm(td.check_in):'')+(td&&td.check_out?' · Out '+hhmm(td.check_out):'')+'</p>'+
   '<button class="btn" id="punch" style="font-size:18px;padding:14px 26px;margin:12px 0">'+(td&&td.check_in?'Punch out':'Punch in')+'</button>'+
   '<p class="muted small" id="pmsg">Allow location when the phone asks. You must be inside the school. Punch in when you arrive and punch out when you leave.</p></div>'+
   '<div class="kpis">'+kpi('Present',String(cnt(['present','late'])+cnt(['half_day'])*0.5),'this month')+kpi('Late',String(cnt(['late'])),'this month')+kpi('Leave',String(cnt(['paid_leave','unpaid_leave'])),'this month')+'</div>'+
   '<div class="card"><h2 style="margin-bottom:10px">This month</h2>'+(rows.length?'<div class="tablewrap"><table><thead><tr><th>Date</th><th>Status</th><th>In</th><th>Out</th></tr></thead><tbody>'+rows.map(r=>'<tr><td class="nowrap">'+fmtDate(r.work_date)+'</td><td>'+stPill(r.status)+'</td><td>'+hhmm(r.check_in)+'</td><td>'+hhmm(r.check_out)+'</td></tr>').join('')+'</tbody></table></div>':'<p class="muted">Nothing yet this month.</p>')+'</div>';
  $('#punch').onclick=()=>{
    const b=$('#punch'),m=$('#pmsg');
    if(!navigator.geolocation){m.textContent='This phone or browser cannot give location. Try Chrome.';return}
    b.disabled=true;m.textContent='Finding your location…';
    navigator.geolocation.getCurrentPosition(async p=>{
      try{const r=await rpc('staff_punch',{p_lat:p.coords.latitude,p_lng:p.coords.longitude,p_accuracy:p.coords.accuracy});
        toast((r.action==='check_in'?'Punched in':'Punched out')+' · '+r.distance_m+' m from school');vMyAttendance(el)}
      catch(e){m.innerHTML='<span class="err">'+esc(errMsg(e))+'</span>';b.disabled=false}
    },er=>{b.disabled=false;m.innerHTML='<span class="err">'+(er.code===1?'Location is blocked. Allow location for this site in the browser settings, then try again.':'Could not get your location. Move near a window and try again.')+'</span>'},{enableHighAccuracy:true,timeout:25000,maximumAge:0});
  };
}

/* =================================================================
   AUTH AND START-UP
================================================================= */
async function startApp(session){
  try{
    S.user=session.user;
    const prof=await q(sb.from('profiles').select('*').eq('id',S.user.id).maybeSingle());
    if(!prof||!prof.is_active||!['owner','teacher'].includes(prof.role)){
      $('#boot').hidden=true;$('#app').hidden=true;$('#gate').hidden=false;
      $('#lerr').textContent='This account does not have access yet. Ask the owner to add you.';await sb.auth.signOut();S.user=null;return}
    S.profile=prof;if(prof.role==='owner')await loadRef();
    $('#who').textContent=prof.full_name;$('#boot').hidden=true;$('#gate').hidden=true;$('#app').hidden=false;
    await route();
  }catch(e){console.error(e);$('#boot').hidden=true;$('#gate').hidden=false;$('#lerr').textContent='Could not load: '+errMsg(e)}
}
$('#loginForm').addEventListener('submit',async e=>{
  e.preventDefault();const b=$('#lbtn');b.disabled=true;$('#lerr').textContent='';
  const {data,error}=await sb.auth.signInWithPassword({email:(()=>{const v=$('#lemail').value.trim();return v.includes('@')?v:v.replace(/\D/g,'').slice(-10)+'@staff.alkhair.in'})(),password:$('#lpass').value});
  b.disabled=false;
  if(error){$('#lerr').textContent=/invalid/i.test(error.message)?'Email, mobile or password is not correct.':error.message;return}
  $('#lpass').value='';await startApp(data.session);
});
$('#logout').onclick=async()=>{await sb.auth.signOut();S.user=null;$('#app').hidden=true;$('#gate').hidden=false;location.hash=''};
(async function init(){
  try{
    const {data}=await sb.auth.getSession();
    if(data&&data.session)await startApp(data.session);else{$('#boot').hidden=true;$('#gate').hidden=false}
  }catch(e){$('#boot').hidden=true;$('#gate').hidden=false;$('#lerr').textContent='Could not reach the server. Check your internet connection.'}
})();
</script>
